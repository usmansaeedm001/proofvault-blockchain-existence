server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: proofvault-api
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  datasource:
    hikari:
      pool-name: ProofVaultHikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.proofvault: ${LOG_LEVEL_PROOFVAULT:INFO}

proofvault:
  blockchain:
    mode: ${BLOCKCHAIN_MODE:mock}
    network-name: ${BLOCKCHAIN_NETWORK:local-foundry}
    explorer-base-url: ${EXPLORER_BASE_URL:http://localhost:8545/tx/}
    rpc-url: ${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
    contract-address: ${PROOFVAULT_CONTRACT_ADDRESS:}
    anchor-private-key: ${PROOFVAULT_ANCHOR_PRIVATE_KEY:}
    anchor-address: ${PROOFVAULT_ANCHOR_ADDRESS:}
    chain-id: ${BLOCKCHAIN_CHAIN_ID:31337}
    gas-price-wei: ${BLOCKCHAIN_GAS_PRICE_WEI:1000000000}
    gas-limit: ${BLOCKCHAIN_GAS_LIMIT:500000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  security:
    authentication-enabled: ${AUTHENTICATION_ENABLED:true}
    audience: ${OAUTH2_AUDIENCE:proofvault-api}
    user-email-claim: ${OAUTH2_EMAIL_CLAIM:email}
    user-name-claim: ${OAUTH2_NAME_CLAIM:preferred_username}

info:
  app:
    name: ProofVault API
    description: Blockchain proof-of-existence API
