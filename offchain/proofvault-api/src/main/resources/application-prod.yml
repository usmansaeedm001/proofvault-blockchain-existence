spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}

proofvault:
  blockchain:
    mode: ethereum
    network-name: ${BLOCKCHAIN_NETWORK}
    explorer-base-url: ${EXPLORER_BASE_URL}
    rpc-url: ${BLOCKCHAIN_RPC_URL}
    chain-id: ${BLOCKCHAIN_CHAIN_ID}
    contract-address: ${PROOFVAULT_CONTRACT_ADDRESS}
    anchor-private-key: ${PROOFVAULT_ANCHOR_PRIVATE_KEY}
    anchor-address: ${PROOFVAULT_ANCHOR_ADDRESS:}
  security:
    authentication-enabled: true

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.05}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: WARN
