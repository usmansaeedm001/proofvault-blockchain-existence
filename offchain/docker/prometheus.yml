global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: proofvault-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - proofvault-api:8080

  - job_name: proofvault-authserver
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - proofvault-authserver:9000

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: promtail
    static_configs:
      - targets:
          - promtail:9080

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
