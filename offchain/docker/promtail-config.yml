server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: proofvault-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '^(?P<timestamp>\S+)\s+(?P<level>[A-Z]+)\s+service=(?P<app>[^\s]+)\s+traceId=(?P<trace_id>[^\s]*)\s+spanId=(?P<span_id>[^\s]*)\s+requestId=(?P<request_id>[^\s]*)\s+thread="(?P<thread>[^"]*)"\s+logger=(?P<logger>[^\s]+)\s+-\s+(?P<message>.*)$'
      - labels:
          app:
          level:
