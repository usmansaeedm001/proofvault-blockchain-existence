services:
  proofvault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:9000
        NEXT_PUBLIC_AUTH_CLIENT_ID: proofvault-spa
        NEXT_PUBLIC_AUTH_REDIRECT_URI: http://localhost:5173/oauth2/callback
        NEXT_PUBLIC_AUTH_SCOPES: openid profile email proof:read proof:write
        NEXT_PUBLIC_WALLET_CHAIN_ID: 11155111
        NEXT_PUBLIC_WALLET_CHAIN_NAME: Sepolia
        NEXT_PUBLIC_WALLET_RPC_URL: "${SEPOLIA_PUBLIC_RPC_URL:-https://rpc.sepolia.org}"
        NEXT_PUBLIC_WALLET_EXPLORER_URL: https://sepolia.etherscan.io
        NEXT_PUBLIC_WALLET_NATIVE_CURRENCY_NAME: Sepolia Ether
        NEXT_PUBLIC_WALLET_NATIVE_CURRENCY_SYMBOL: ETH
    image: proofvault-frontend:sepolia
    container_name: proofvault-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      proofvault-api:
        condition: service_started
      proofvault-authserver:
        condition: service_started
    networks:
      - proofvault

  proofvault-api:
    build:
      context: ./offchain/proofvault-api
      dockerfile: Dockerfile
    image: proofvault-api:sepolia
    container_name: proofvault-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: sepolia
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://proofvault-mysql:3306/proofvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: proofvault
      DB_PASSWORD: "${DB_PASSWORD:-proofvault_local_password}"
      AUTHENTICATION_ENABLED: "true"
      OAUTH2_ISSUER_URI: http://localhost:9000
      OAUTH2_JWK_SET_URI: http://proofvault-authserver:9000/oauth2/jwks
      OAUTH2_AUDIENCE: proofvault-api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      BLOCKCHAIN_MODE: ethereum
      BLOCKCHAIN_NETWORK: sepolia
      BLOCKCHAIN_RPC_URL: "${SEPOLIA_RPC_URL:-https://rpc.sepolia.org}"
      BLOCKCHAIN_CHAIN_ID: "11155111"
      EXPLORER_BASE_URL: https://sepolia.etherscan.io/tx/
      PROOFVAULT_CONTRACT_ADDRESS: "${PROOFVAULT_CONTRACT_ADDRESS:-}"
      PROOFVAULT_ANCHOR_ADDRESS: "${PROOFVAULT_ANCHOR_ADDRESS:-}"
      PROOFVAULT_ANCHOR_PRIVATE_KEY: "${PROOFVAULT_ANCHOR_PRIVATE_KEY:-}"
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_PROBABILITY: "1.0"
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_PROOFVAULT: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      proofvault-mysql:
        condition: service_healthy
      proofvault-authserver:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - proofvault

  proofvault-authserver:
    build:
      context: ./offchain/authserver
      dockerfile: Dockerfile
    image: proofvault-authserver:sepolia
    container_name: proofvault-authserver
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: sepolia
      SERVER_PORT: 9000
      DB_URL: jdbc:mysql://proofvault-mysql:3306/proofvault_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: proofvault
      DB_PASSWORD: "${DB_PASSWORD:-proofvault_local_password}"
      AUTH_ISSUER: http://localhost:9000
      AUTH_AUDIENCE: proofvault-api
      AUTH_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_FRONTEND_REDIRECT_URI: http://localhost:5173/oauth2/callback
      AUTH_FRONTEND_LOGOUT_REDIRECT_URI: http://localhost:5173
      AUTH_BOOTSTRAP_ENABLED: "true"
      AUTH_BOOTSTRAP_USER_EMAIL: admin@proofvault.local
      AUTH_BOOTSTRAP_USER_PASSWORD: ChangeMeLocal123!
      AUTH_BOOTSTRAP_CLIENT_SECRET: proofvault-local-secret
      AUTH_FRONTEND_PUBLIC_CLIENT_ID: proofvault-spa
      AUTH_SIGNING_REQUIRE_CONFIGURED_KEY: "false"
      AUTH_WALLET_ENABLED: "true"
      AUTH_WALLET_CHAIN_ID: "11155111"
      AUTH_WALLET_DOMAIN: localhost:5173
      AUTH_WALLET_URI: http://localhost:5173
      OTEL_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_PROBABILITY: "1.0"
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_PROOFVAULT: DEBUG
    ports:
      - "9000:9000"
    depends_on:
      proofvault-mysql:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - proofvault

  proofvault-mysql:
    image: mysql:8.4
    container_name: proofvault-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: proofvault
      MYSQL_USER: proofvault
      MYSQL_PASSWORD: "${DB_PASSWORD:-proofvault_local_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-proofvault_root_local_password}"
    ports:
      - "3306:3306"
    volumes:
      - ./offchain/docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - proofvault-sepolia-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - proofvault

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: proofvault-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./offchain/docker/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    networks:
      - proofvault

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: proofvault-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./offchain/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - proofvault-sepolia-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - proofvault-api
      - otel-collector
    networks:
      - proofvault

  grafana:
    image: grafana/grafana:11.1.0
    container_name: proofvault-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-proofvault_admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./offchain/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./offchain/docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - proofvault-sepolia-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - proofvault

networks:
  proofvault:
    driver: bridge

volumes:
  proofvault-sepolia-mysql-data:
  proofvault-sepolia-prometheus-data:
  proofvault-sepolia-grafana-data:
