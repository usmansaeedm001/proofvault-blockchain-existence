spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

proofvault:
  auth:
    bootstrap:
      enabled: false
    signing:
      require-configured-key: true
      private-key-pem: ${AUTH_SIGNING_PRIVATE_KEY_PEM}
      public-key-pem: ${AUTH_SIGNING_PUBLIC_KEY_PEM:}
    wallet:
      enabled: ${AUTH_WALLET_ENABLED:true}
      chain-id: ${AUTH_WALLET_CHAIN_ID}
      domain: ${AUTH_WALLET_DOMAIN}
      uri: ${AUTH_WALLET_URI}

management:
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:0.1}
