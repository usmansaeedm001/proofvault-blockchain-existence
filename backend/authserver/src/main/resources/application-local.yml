spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:mem:proofvault_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

proofvault:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
      redirect-uris: ${AUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/callback}
      post-logout-redirect-uris: ${AUTH_FRONTEND_LOGOUT_REDIRECT_URI:http://localhost:5173}
    signing:
      require-configured-key: false
    wallet:
      enabled: ${AUTH_WALLET_ENABLED:true}
      chain-id: ${AUTH_WALLET_CHAIN_ID:31337}
      domain: ${AUTH_WALLET_DOMAIN:localhost:5173}
      uri: ${AUTH_WALLET_URI:http://localhost:5173}

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
