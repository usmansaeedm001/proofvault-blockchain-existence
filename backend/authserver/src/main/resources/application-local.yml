spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:mem:proofvault_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

proofvault:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
    signing:
      require-configured-key: false
