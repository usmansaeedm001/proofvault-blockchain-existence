spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

proofvault:
  auth:
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    signing:
      require-configured-key: ${AUTH_SIGNING_REQUIRE_CONFIGURED_KEY:true}
