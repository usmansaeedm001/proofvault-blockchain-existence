<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ProofVault upload and verification flow</title>
  <desc id="desc">A product snapshot showing backend-controlled file anchoring, proof history, public verification, on-chain lookup, and certificate download.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54f4b4"/>
      <stop offset="1" stop-color="#d7ffe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="36" y="34" width="1368" height="832" rx="10" fill="#0b1018" stroke="#243044"/>
  <text x="78" y="92" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="38" font-weight="800">Proof workflow</text>
  <text x="80" y="128" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="18">Upload, hash, anchor through the API, verify off-chain/on-chain, and export a certificate.</text>
  <rect x="1060" y="70" width="288" height="48" rx="8" fill="url(#button)"/>
  <text x="1134" y="101" fill="#05110c" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="800">Anchor File</text>
  <g filter="url(#shadow)">
    <rect x="78" y="170" width="418" height="578" rx="8" fill="#121923" stroke="#273346"/>
    <rect x="112" y="214" width="350" height="174" rx="8" fill="#090d14" stroke="#2d8b6d"/>
    <circle cx="287" cy="274" r="32" fill="#12382d"/>
    <path d="M287 253v42M266 274h42" stroke="#54f4b4" stroke-width="6"/>
    <text x="157" y="336" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="23" font-weight="800">Drop file to anchor</text>
    <text x="145" y="364" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="15">Raw files are never stored after hashing.</text>
    <text x="112" y="446" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">CURRENT HASH</text>
    <rect x="112" y="466" width="350" height="82" rx="8" fill="#0a0f17" stroke="#273346"/>
    <text x="134" y="500" fill="#54f4b4" font-family="Consolas,monospace" font-size="15">f4d2b94d...b4f634aa</text>
    <text x="134" y="526" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="14">SHA-256 fingerprint generated locally</text>
    <text x="112" y="604" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">PUBLIC VERIFY</text>
    <rect x="112" y="624" width="350" height="72" rx="8" fill="#0a0f17" stroke="#273346"/>
    <text x="134" y="655" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="700">Proof exists</text>
    <text x="134" y="679" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="14">Timestamp and tx hash returned</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="528" y="170" width="834" height="578" rx="8" fill="#121923" stroke="#273346"/>
    <text x="566" y="218" fill="#95a3b8" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">VAULT HISTORY</text>
    <text x="566" y="250" fill="#ffffff" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="800">Recent anchored assets</text>
    <g font-family="Inter,Segoe UI,Arial">
      <rect x="566" y="292" width="756" height="92" rx="8" fill="#0a0f17" stroke="#273346"/>
      <circle cx="610" cy="338" r="24" fill="#12382d"/><path d="M599 338h22M610 327v22" stroke="#54f4b4" stroke-width="4"/>
      <text x="650" y="328" fill="#ffffff" font-size="18" font-weight="800">client-contract-v7.pdf</text>
      <text x="650" y="354" fill="#95a3b8" font-family="Consolas,monospace" font-size="14">f4d2b94d...b4f634aa</text>
      <text x="980" y="338" fill="#c8d2e1" font-size="14">1.4 MB</text>
      <text x="1082" y="338" fill="#c8d2e1" font-size="14">local-anvil</text>
      <rect x="1238" y="318" width="46" height="38" rx="8" fill="#172231" stroke="#334158"/>
      <path d="M1251 337h20M1261 327v20" stroke="#67d8ff" stroke-width="3"/>
      <rect x="566" y="406" width="756" height="92" rx="8" fill="#0a0f17" stroke="#273346"/>
      <circle cx="610" cy="452" r="24" fill="#12382d"/><path d="M599 452h22M610 441v22" stroke="#54f4b4" stroke-width="4"/>
      <text x="650" y="442" fill="#ffffff" font-size="18" font-weight="800">brand-system-export.zip</text>
      <text x="650" y="468" fill="#95a3b8" font-family="Consolas,monospace" font-size="14">bc32f037...116d8e85</text>
      <text x="980" y="452" fill="#c8d2e1" font-size="14">8.7 MB</text>
      <text x="1082" y="452" fill="#c8d2e1" font-size="14">local-anvil</text>
      <rect x="1238" y="432" width="46" height="38" rx="8" fill="#172231" stroke="#334158"/>
      <path d="M1251 451h20M1261 441v20" stroke="#67d8ff" stroke-width="3"/>
      <rect x="566" y="520" width="756" height="92" rx="8" fill="#0a0f17" stroke="#273346"/>
      <circle cx="610" cy="566" r="24" fill="#12382d"/><path d="M599 566h22M610 555v22" stroke="#54f4b4" stroke-width="4"/>
      <text x="650" y="556" fill="#ffffff" font-size="18" font-weight="800">source-snapshot.tar.gz</text>
      <text x="650" y="582" fill="#95a3b8" font-family="Consolas,monospace" font-size="14">77a93a4a...8b26d58c</text>
      <text x="980" y="566" fill="#c8d2e1" font-size="14">3.0 MB</text>
      <text x="1082" y="566" fill="#c8d2e1" font-size="14">local-anvil</text>
      <rect x="1238" y="546" width="46" height="38" rx="8" fill="#172231" stroke="#334158"/>
      <path d="M1251 565h20M1261 555v20" stroke="#67d8ff" stroke-width="3"/>
      <rect x="566" y="648" width="756" height="46" rx="8" fill="#12382d" stroke="#2d8b6d"/>
      <text x="598" y="677" fill="#54f4b4" font-size="16" font-weight="800">Certificate ready after backend anchoring and blockchain receipt</text>
    </g>
  </g>
</svg>
